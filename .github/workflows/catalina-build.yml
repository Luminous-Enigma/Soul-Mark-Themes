name: catalina-build

# Builds ArtCraft desktop for macOS 10.15 with catalina-patcher on GitHub's Intel Mac, audits it
# against the 10.15 SDK, and keeps the app as a download for 14 days. Never on every pull
# request: started by hand, or by a push to a work branch that changes
# catalina-patcher/ci/request.txt (the release tag to build).
# Merging to main never starts one: each build counts against the owner's approved number.
# See ci/README.md.
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    paths:
      - catalina-patcher/ci/request.txt

permissions: {}

concurrency:
  group: catalina-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      # The runner's own temp folder ("runner" isn't available to a job's env, only to steps).
      - name: Work folder
        run: echo "ARTCRAFT_CATALINA_WORK=$RUNNER_TEMP/artcraft-catalina" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node 20: the newest line that still runs on Catalina, so the build matches the owner's Mac.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Doctor
        run: bash catalina-patcher/artcraft-catalina.sh doctor
      - name: Build
        run: bash catalina-patcher/artcraft-catalina.sh build "$(head -1 catalina-patcher/ci/request.txt)"
      # The finished app, as a download for the owner to try on Catalina. ditto keeps the
      # bundle's symlinks, permissions and signature, which a plain upload would lose.
      - name: Pack the app
        run: |
          app="$(ls -d "$ARTCRAFT_CATALINA_WORK"/ArtCraft-*-catalina.app | head -1)"
          zip="$RUNNER_TEMP/$(basename "$app").zip"
          ditto -c -k --keepParent "$app" "$zip"
          ls -lh "$zip"
          echo "APP_ZIP=$zip" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ArtCraft-catalina-app
          path: ${{ env.APP_ZIP }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: End of the build log
        if: failure()
        run: tail -n 200 "$ARTCRAFT_CATALINA_WORK/build.log" || true
      - name: Report
        if: always()
        run: |
          app="$(ls -d "$ARTCRAFT_CATALINA_WORK"/ArtCraft-*-catalina.app 2>/dev/null | head -1)"
          if [ -z "$app" ]; then echo 'REPORT_JSON {"built":false}'; exit 0; fi
          check="$(bash catalina-patcher/artcraft-catalina.sh --json check "$app")"
          audit="$(bash catalina-patcher/artcraft-catalina.sh --json audit "$app" || true)"
          echo "REPORT_JSON {\"built\":true,\"check\":$check,\"audit\":$audit}"
